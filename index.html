<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <section>
            <p id="greeting">Good morning!</p>
            <div id="name-display">
                <h1 id="user-name">Welcome to your dashboard</h1>
                <button id="change-name-btn" aria-label="Edit your name">Edit Name</button>
            </div>
            <form id="name-form" aria-label="Change your name" hidden>
                <label for="name-input">Your name</label>
                <div id="name-form-controls">
                    <input
                        type="text"
                        id="name-input"
                        placeholder="Enter your name"
                        maxlength="40"
                        autocomplete="given-name"
                    >
                    <button type="submit">Save</button>
                    <button type="button" id="cancel-name-btn">Cancel</button>
                </div>
            </form>
        </section>

        <section>
            <time id="current-time">00:00</time>
            <p id="current-date">Loading date...</p>
            <button id="theme-toggle" aria-label="Switch to light mode">☀️ Light</button>
        </section>
    </header>


    <main>

        <section id="todo-section">
            <h2>My Tasks</h2>

            <form id="task-form">
                <div id="task-form-fields">
                    <input
                        type="text"
                        id="task-input"
                        placeholder="What do you need to do?"
                    >
                    <textarea
                        id="task-notes"
                        placeholder="Add a note (optional)"
                        rows="2"
                        maxlength="200"
                    ></textarea>
                </div>
                <button type="submit">Add Task</button>
            </form>

            <div id="task-toolbar">
                <label for="sort-select">Sort</label>
                <select id="sort-select" aria-label="Sort tasks">
                    <option value="default">Default</option>
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                    <option value="pending">Pending first</option>
                </select>
            </div>

            <ul id="task-list"></ul>
        </section>


        <section id="timer-section">
            <h2>Focus Timer</h2>

            <time id="timer">25:00</time>

            <p>Stay focused and get things done!</p>

            <div id="timer-controls">
                <button id="start-btn">Start</button>
                <button id="stop-btn">Stop</button>
                <button id="reset-btn">Reset</button>
            </div>

            <div id="pomodoro-duration">
                <label for="pomodoro-input">Duration (min)</label>
                <input
                    type="number"
                    id="pomodoro-input"
                    min="1"
                    max="99"
                    value="25"
                    aria-label="Set timer duration in minutes"
                >
            </div>
        </section>

    <section id="links-section">
    <h2>Quick Links</h2>

    <form id="link-form">
        <input
            type="text"
            id="link-name"
            placeholder="Website name"
        >

        <input
            type="url"
            id="link-url"
            placeholder="https://example.com"
        >

        <button type="submit">Add Link</button>
    </form>

    <nav id="quick-links"></nav>
    </section>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
